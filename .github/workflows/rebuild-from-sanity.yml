name: Rebuild from Sanity publish

on:
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Trigger hosting deployment
        run: |
          git config user.name "sendian-security-bot"
          git config user.email "sendian-security-bot@users.noreply.github.com"
          git commit --allow-empty -m "chore: rebuild after Sanity publish"
          git push origin HEAD:main
